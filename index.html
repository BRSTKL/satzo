<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Satzo</title>
<meta name="theme-color" content="#0F1328">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Satzo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon180.png">
<link rel="icon" href="icons/icon192.png">
<link rel="stylesheet" href="feed.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="brand" id="toWords"><img src="icons/icon192.png" alt="" width="26" height="26"><span>Satzo</span></a>
    <div class="goal" id="goal" aria-live="polite"></div>
    <div class="chips">
      <span class="chip" id="streak"></span>
      <span class="chip" id="xp"></span>
    </div>
  </header>
  <main class="stage" id="stage"><div id="ytwrap"><div id="yt"></div></div></main>
  <div class="toast" id="toast" role="status" hidden></div>
</div>
<script src="host.js"></script>
<script src="feed.js"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
